name: CMake

on:
  - push

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-16.04
    steps:
    - uses: actions/checkout@v2
    - name: Setup dependencies
      run: sudo apt-get install libboost-dev
    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        make -j$(getconf _NPROCESSORS_ONLN)
