name: Docs on demand

on:
  pull_request:
    types:
      - opened
  issue_comment:
    types:
      - created

env:
  BUILD_TYPE: Release

jobs:
  publish:
    runs-on: ubuntu-16.04
    steps:
      - uses: khan/pull-request-comment-trigger@master
        id: trigger
        with:
          trigger: "/publish"
          reaction: rocket
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - uses: actions/checkout@v2
        if: steps.trigger.outputs.triggered == 'true'
      - name: Setup dependencies
        run: sudo apt-get install doxygen libboost-dev
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          make doc -j$(getconf _NPROCESSORS_ONLN)
      - name: Publish to azure webapp
        uses: Azure/webapps-deploy@v1
        with:
          app-name: psiact
          package: doc/html
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
